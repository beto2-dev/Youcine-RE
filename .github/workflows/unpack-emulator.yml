name: Dynamic unpack (emulator)

# Youcine-RE - iJiami dump on an x86_64 emulator.
#
# Why a "dump build": the packed APK ships lib/{armeabi-v7a,arm64-v8a} only.
# On an x86_64 emulator with native-bridge (ndk_translation) the installer
# assigns primaryCpuAbi=arm64-v8a, the iJiami stub then extracts
# assets/ijm_lib/arm64-v8a/libexec.so and runs it TRANSLATED. SecLLVM
# self-modifying code does not survive translation, JNI registration for
# s.h.e.l.l.N.al never happens and the app dies before decrypting DEX
# (observed in run #34044920876). Stripping lib/arm* yields a pure x86_64
# process: the stub selects assets/ijm_lib/x86_64/libexec.so natively.
#
# Fallback: a macOS-14 runner runs an arm64-v8a emulator where the ORIGINAL
# apk executes natively (like real devices).
#
# Finally the rebuild job restores the real Application class, drops packer
# assets, swaps in the dumped classes*.dex, zipaligns, signs and publishes
# the 'unpacked-1.17.6' release for the boot-test workflow.

on:
  workflow_dispatch:
    inputs:
      apk_source:
        description: 'packed APK source'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - secret
      api_level:
        description: 'x86_64 emulator API level'
        required: true
        default: '30'
        type: string
      release_tag:
        default: 'packed-1.17.6'
      release_asset:
        default: 'ycMob_1.17.6_ycsite.apk'

permissions:
  contents: write

jobs:
  unpack-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      dex_count: ${{ steps.count.outputs.dex_count }}
    env:
      APP_ID: com.world.youcinemobile
      LAUNCH: com.mobile.brasiltv.activity.SplashAty
      EXPECT_DEX: '4'
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python deps
        run: python3 -m pip install --quiet androguard pycryptodome

      - uses: android-actions/setup-android@v3

      - name: SDK + AVD
        env:
          API: ${{ github.event.inputs.api_level || '30' }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-${API};google_apis;x86_64" \
            "platforms;android-${API}" "build-tools;34.0.0" > /dev/null
          echo "no" | avdmanager create avd -n youcine \
            -k "system-images;android-${API};google_apis;x86_64" \
            -d pixel_4 --force

      - name: Fetch packed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work dumped/youcine
          if [ "${{ github.event.inputs.apk_source }}" = "release" ]; then
            gh release download "${{ github.event.inputs.release_tag }}" \
              -R "${{ github.repository }}" \
              -p "${{ github.event.inputs.release_asset }}" \
              -O work/packed.apk
          else
            curl -fL --retry 3 -o work/packed.apk "${{ secrets.SAMPLE_URL }}"
          fi
          sha256sum work/packed.apk | tee work/apk.sha256
          grep -q 28d028d75c89e6ab90c8b7e57a32c42355ac5ae2e388ea1e541bd003cae10d83 work/apk.sha256 \
            || echo "::warning::SHA-256 differs from the analysed 1.17.6 sample"

      - name: Dump build (strip ARM lib/ -> force native x86_64 packer)
        run: |
          python3 unpack/make_dump_build.py --apk work/packed.apk --out work/dump-build.apk
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          zipalign -f 4 work/dump-build.apk work/dump-build-aligned.apk
          keytool -genkeypair -keystore work/re.keystore -storepass android \
            -alias re -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Youcine-RE,O=Research,C=US" 2>/dev/null
          apksigner sign --ks work/re.keystore --ks-pass pass:android \
            --out work/dump-build-signed.apk work/dump-build-aligned.apk
          apksigner verify --print-certs work/dump-build-signed.apk | head -5
          ls -l work/

      - name: Boot emulator and dump
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '30' }}
          arch: x86_64
          avd-name: youcine
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -x
            adb root || true
            sleep 5
            adb install -r -g work/dump-build-signed.apk
            adb logcat -c || true
            adb shell am start -n $APP_ID/$LAUNCH || true
            python3 unpack/external_memdump.py \
              --app "$APP_ID" \
              --out-dir dumped/youcine \
              --expect "$EXPECT_DEX" \
              --timeout 300 \
              --settle 1.2 \
              --pull-app-data || true
            adb shell "ps -A | grep youcine || echo APP_NOT_RUNNING" || true
            # which libexec did the stub extract?
            adb shell "ls -l /data/data/$APP_ID/files/ 2>/dev/null" || true
            adb pull /data/data/$APP_ID/files/libexec.so dumped/youcine/libexec.extracted.so 2>/dev/null || true
            adb logcat -d -b main,system,crash > work/logcat.txt 2>/dev/null || true
            cp -f work/logcat.txt work/logcat-x86.txt || true
            ls -la dumped/youcine || true
            mkdir -p count
            echo "dex_count=$(ls dumped/youcine/dex_*.bin 2>/dev/null | wc -l | tr -d ' ')" > count/dex_count
            cat count/dex_count

      - name: Collect output
        id: count
        run: |
          val=$(cat count/dex_count 2>/dev/null || echo 0)
          echo "dex_count=$val" >> "$GITHUB_OUTPUT"
          echo "x86 dex dumps: $val"
          grep -E "ijiami|s\.h\.e\.l\.l|UnsatisfiedLink|dlopen|libexec|FATAL" \
            work/logcat.txt | head -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dumps-x86
          path: |
            dumped/
            work/logcat-x86.txt
            work/apk.sha256
            work/dump-build.apk.sha256
          if-no-files-found: warn
          retention-days: 7

  unpack-arm:
    needs: unpack-x86
    if: needs.unpack-x86.outputs.dex_count == '0'
    runs-on: macos-14
    timeout-minutes: 50
    env:
      APP_ID: com.world.youcinemobile
      LAUNCH: com.mobile.brasiltv.activity.SplashAty
      EXPECT_DEX: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3

      - name: SDK + ARM AVD
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" > /dev/null
          IMG=""
          for api in 33 30 31 32 34; do
            if sdkmanager "system-images;android-${api};google_apis;arm64-v8a" "platforms;android-${api}" > /dev/null 2>&1; then
              IMG="system-images;android-${api};google_apis;arm64-v8a"
              echo "ARM_API=$api" >> "$GITHUB_ENV"
              break
            fi
          done
          [ -z "$IMG" ] && { echo "::error::no arm64-v8a google_apis image"; exit 1; }
          echo "using $IMG"
          echo "no" | avdmanager create avd -n youcine-arm -k "$IMG" -d pixel_4 --force

      - name: Fetch packed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work dumped/youcine
          gh release download "${{ github.event.inputs.release_tag }}" \
            -R "${{ github.repository }}" \
            -p "${{ github.event.inputs.release_asset }}" \
            -O work/packed.apk
          sha256sum work/packed.apk || shasum -a 256 work/packed.apk

      - name: Boot emulator and dump (native arm64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ARM_API }}
          arch: arm64-v8a
          avd-name: youcine-arm
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -x
            adb root || true
            sleep 5
            adb install -r -g work/packed.apk
            adb logcat -c || true
            adb shell am start -n $APP_ID/$LAUNCH || true
            python3 unpack/external_memdump.py \
              --app "$APP_ID" \
              --out-dir dumped/youcine \
              --expect "$EXPECT_DEX" \
              --timeout 300 \
              --settle 1.2 \
              --pull-app-data || true
            adb shell "ps -A | grep youcine || echo APP_NOT_RUNNING" || true
            adb pull /data/data/$APP_ID/files/libexec.so dumped/youcine/libexec.extracted.so 2>/dev/null || true
            adb logcat -d -b main,system,crash > work/logcat.txt 2>/dev/null || true
            cp -f work/logcat.txt work/logcat-arm.txt || true
            ls -la dumped/youcine || true
            mkdir -p count
            echo "dex_count=$(ls dumped/youcine/dex_*.bin 2>/dev/null | wc -l | tr -d ' ')" > count/dex_count
            cat count/dex_count

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dumps-arm
          path: |
            dumped/
            work/logcat-arm.txt
            work/packed.apk
          if-no-files-found: warn
          retention-days: 7

  rebuild:
    needs: [unpack-x86, unpack-arm]
    if: always() && (needs.unpack-x86.outputs.dex_count != '0' || needs.unpack-arm.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APKTOOL_JAR: work/apktool.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3

      - name: SDK + apktool
        run: |
          sdkmanager "build-tools;34.0.0" > /dev/null || true
          curl -fsSL -o work/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar

      - name: Download dumps
        uses: actions/download-artifact@v4
        with:
          pattern: dumps-*
          merge-multiple: true
          path: dumps/

      - name: Show dumps
        run: |
          find dumps -maxdepth 3 -type f | head -40 || true
          ls -la dumps/youcine/*.bin 2>/dev/null | head || true

      - name: Validate and rebuild unpacked APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          APK="dumps-arm/work/packed.apk"
          [ -f "$APK" ] || APK="dumps/work/packed.apk"
          # packed apk fallback: fetch from release
          if [ ! -f "$APK" ]; then
            gh release download packed-1.17.6 -R "$GITHUB_REPOSITORY" \
              -p ycMob_1.17.6_ycsite.apk -O work/packed.apk
            APK="work/packed.apk"
          fi
          mkdir -p dexs
          python3 unpack/validate_and_extract_dex.py \
            --dump-dir dumps/youcine --out-dir dexs --min-size 65536 || true
          ls -la dexs/ || true
          if ls dexs/*.dex >/dev/null 2>&1; then
            python3 unpack/rebuild_unpacked_apk.py \
              --apk "$APK" \
              --dump-dir dexs \
              --out work/youcine-1.17.6-unpacked.apk \
              --keystore work/re.keystore \
              --storepass android
            sha256sum work/youcine-1.17.6-unpacked.apk | tee work/unpacked.sha256
            # publish for the boot-test workflow
            gh release create unpacked-1.17.6 \
              --title "Unpacked research build 1.17.6" \
              --notes "Packer-stripped research build produced by the dynamic-unpack workflow. See docs/en/06-dynamic-unpack.md." \
              --target "$GITHUB_SHA" || true
            gh release upload unpacked-1.17.6 \
              work/youcine-1.17.6-unpacked.apk work/unpacked.sha256 --clobber || true
          else
            echo "::warning::no valid DEX dumps; nothing to rebuild"
            exit 3
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youcine-unpacked-${{ github.run_id }}
          path: |
            work/*.apk
            work/*.sha256
            dexs/
            dumps/youcine/*.bin
            dumps/youcine/maps_snapshot.txt
            dumps/youcine/libexec.extracted.so
          if-no-files-found: warn
          retention-days: 7
