name: Dynamic unpack (emulator)

# Youcine-RE - iJiami unpack.
#
# PRIMARY (unpack-nodebug): the ORIGINAL apk on the google_apis x86_64 image
# booted with `-prop ro.debuggable=0 -prop ro.secure=0`. Run evidence
# (34044920876 / 34048953559 / 34049784110): on the stock debuggable image
# every app runs with JDWP open and s.h.e.l.l.N.al silently refuses to
# register (no linker error, no kill). Boot-time props remove the app
# debuggable flag while keeping adbd root (ro.secure=0) for the
# out-of-process /proc/<pid>/mem sweep. The apk is installed with
# --abi armeabi-v7a so the stub extracts ijm_lib/x86 (NATIVE x86 SecLLVM).
#
# SECONDARY (unpack-playstore): BlackDex (GPL-3.0, CodingGay) on the
# production google_apis_playstore image (ro.debuggable=0, no su, no root
# needed). BlackDex installs the target from its REAL sourceDir
# (byte-identical original apk: content + signature gates pass) and dumps
# the decrypted DEX from inside its own sandbox. BlackDex32 first (sandbox
# is 32-bit -> ijm_lib/x86 native), BlackDex64 as fallback.
#
# DOCUMENTED PATH (unpack-x86, skipped by default): tamper research on the
# re-signed dump-build - the content-integrity gate refuses to decrypt a
# modified APK (death ladder neutralized by trace_guard.c; kept as record).
#
# unpack-selfhosted-mac (opt-in): full-speed native arm64 emulator on your
# own Mac runner (HVF works on real hardware).
#
# rebuild: restores the real Application class, drops packer assets, swaps
# in the dumped classes*.dex, zipaligns, signs, publishes the
# 'unpacked-1.17.6' release and chains the boot-test workflow.

on:
  workflow_dispatch:
    inputs:
      apk_source:
        description: 'packed APK source'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - secret
      api_level:
        description: 'emulator API level'
        required: true
        default: '30'
        type: string
      skip_x86:
        description: 'skip the x86_64 tamper-research job (default: yes)'
        required: false
        default: true
        type: boolean
      run_selfhosted:
        description: 'run the self-hosted macOS job (requires your own runner)'
        required: false
        default: false
        type: boolean
      release_tag:
        default: 'packed-1.17.6'
      release_asset:
        default: 'ycMob_1.17.6_ycsite.apk'

permissions:
  contents: write

jobs:
  unpack-nodebug:
    # PRIMARY: original apk, non-debuggable boot props, root memdump.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      dex_count: ${{ steps.count_nd.outputs.dex_count }}
    env:
      APP_ID: com.world.youcinemobile
      LAUNCH: com.mobile.brasiltv.activity.SplashAty
      EXPECT_DEX: '4'
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3

      - name: "SDK + AVD (ramdisk surgery: non-debuggable boot)"
        env:
          API: ${{ github.event.inputs.api_level || '30' }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-${API};google_apis;x86_64" \
            "platforms;android-${API}" > /dev/null
          # --- ramdisk surgery -------------------------------------------------
          # /default.prop (ramdisk) sets ro.secure=1 ro.debuggable=1 and both
          # are first-set-wins: build.prop edits and -prop are ignored (run
          # 34081223822: emulator rejects non-qemu -prop; sed needs a working
          # remount which fails). Patching the ramdisk before the first boot
          # is the only clean fix: ro.debuggable=0 -> apps run non-debuggable
          # (no JDWP transport), ro.secure=0 -> adbd runs as root from boot
          # so the out-of-process /proc/<pid>/mem sweep still works.
          SRC="$ANDROID_HOME/system-images/android-${API}/google_apis/x86_64"
          mkdir -p work/image
          cp -a "$SRC"/. work/image/
          ls -la work/image | head -12
          python3 unpack/patch_ramdisk.py --image work/image/ramdisk.img \
            --set 'ro.debuggable=1:0' --set 'ro.secure=1:0' || \
            { echo "::error::ramdisk patch failed"; exit 1; }
          echo "no" | avdmanager create avd -n youcine \
            -k "system-images;android-${API};google_apis;x86_64" \
            -d pixel_4 --force
          AVD_INI="$HOME/.android/avd/youcine.avd/config.ini"
          sed -i "s|^image.sysdir.1=.*|image.sysdir.1=$(pwd)/work/image/|" "$AVD_INI" || true
          grep -q '^image.sysdir.1=' "$AVD_INI" || \
            echo "image.sysdir.1=$(pwd)/work/image/" >> "$AVD_INI"
          grep -E "image.sysdir" "$AVD_INI"

      - name: Fetch packed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work dumped/youcine count
          if [ "${{ github.event.inputs.apk_source }}" = "release" ]; then
            gh release download "${{ github.event.inputs.release_tag }}" \
              -R "${{ github.repository }}" \
              -p "${{ github.event.inputs.release_asset }}" \
              -O work/packed.apk
          else
            curl -fL --retry 3 -o work/packed.apk "${{ secrets.SAMPLE_URL }}"
          fi
          sha256sum work/packed.apk | tee work/apk.sha256

      - name: Boot emulator (non-debuggable ramdisk) and dump
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '30' }}
          arch: x86_64
          avd-name: youcine
          target: google_apis
          # NOTE: the emulator only accepts qemu.* via -prop (run evidence
          # 34081223822); the non-debuggable boot comes from the patched
          # ramdisk, the qemu-signal spoofing from unpack/patch_props.py.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash unpack/nodebug_flow.sh || true

      - name: Collect output
        id: count_nd
        if: always()
        run: |
          val=$(cat count/dex_count 2>/dev/null || echo 0)
          echo "dex_count=${val:-0}" >> "$GITHUB_OUTPUT"
          echo "nodebug dex dumps: ${val:-0}"

      - name: Gate (fail job when no dumps)
        if: always() && steps.count_nd.outputs.dex_count == '0'
        run: |
          echo '::error::nodebug run produced 0 DEX (see dumps-nodebug artifact: logcat + dmesg-linker + props evidence).'
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dumps-nodebug
          path: |
            dumped/
            work/logcat-nodebug.txt
            work/dmesg-linker.txt
            work/props-evidence.txt
            work/props-after.txt
            work/qemu-devices.txt
            work/public-libraries.txt
            work/abi-info.txt
            work/ps-after.txt
            work/maps-app.txt
            work/packed.apk
            work/apk.sha256
          if-no-files-found: warn
          retention-days: 7

  unpack-playstore:
    # SECONDARY: BlackDex sandbox on the production image (no root needed).
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      dex_count: ${{ steps.count_ps.outputs.dex_count }}
    env:
      APP_ID: com.world.youcinemobile
      BD32_SHA256: e916ff31bddf746c313d8eee8036e8d8436b7923ec63e2b3e99ab2e68e4b04f1
      BD64_SHA256: 173a13f8ccb1c523dab8930aa06d0635196dee753bd61e90c8add5f8a018ba59
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3

      - name: "SDK + playstore AVD (self-verifying)"
        env:
          API: ${{ github.event.inputs.api_level || '30' }}
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-${API};google_apis_playstore;x86_64" \
            "platforms;android-${API}" 2>&1 | tail -5 || true
          # avdmanager fails with EXIT 0 when the package path is invalid
          # (classic bug) - verify the AVD files actually exist afterwards.
          ls "$ANDROID_HOME/system-images/android-${API}/google_apis_playstore/x86_64/" || \
            { echo "::error::playstore image not installed"; exit 1; }
          echo "no" | avdmanager create avd -n youcine-ps \
            -k "system-images;android-${API};google_apis_playstore;x86_64" \
            -d pixel_4 --force 2>&1 | tail -3 || true
          if [ ! -f "$ANDROID_AVD_HOME/youcine-ps.ini" ]; then
            echo "::warning::AVD not in ANDROID_AVD_HOME; searching..."
            FOUND=$(find /home/runner /usr/local/lib/android/sdk -name 'youcine-ps.ini' 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              export ANDROID_AVD_HOME="$(dirname "$FOUND")"
              echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
            else
              echo "::error::youcine-ps AVD was never created"
              exit 1
            fi
          else
            echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          fi
          ls -la "$ANDROID_AVD_HOME" | head -8
          cat "$ANDROID_AVD_HOME/youcine-ps.ini" 2>/dev/null | head -10

      - name: Fetch packed APK + BlackDex
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work dumped/youcine count dumps
          gh release download "${{ github.event.inputs.release_tag }}" \
            -R "${{ github.repository }}" \
            -p "${{ github.event.inputs.release_asset }}" \
            -O work/packed.apk
          sha256sum work/packed.apk | tee work/apk.sha256
          curl -fsSL --retry 3 -o work/blackdex32.apk \
            https://github.com/CodingGay/BlackDex/releases/download/v3.2/app-BlackDex32.apk
          curl -fsSL --retry 3 -o work/blackdex64.apk \
            https://github.com/CodingGay/BlackDex/releases/download/v3.2/app-BlackDex64.apk
          echo "$BD32_SHA256  work/blackdex32.apk" | sha256sum -c -
          echo "$BD64_SHA256  work/blackdex64.apk" | sha256sum -c -

      - name: Boot playstore emulator (manual)
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          nohup emulator -avd youcine-ps -no-window -gpu swiftshader_indirect \
            -noaudio -no-boot-anim -camera-back none -port 5554 \
            > work/emulator.log 2>&1 &
          for i in $(seq 1 90); do
            v=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$v" = "1" ] && echo "BOOT_OK after $((i*10))s" && exit 0
            sleep 10
          done
          echo "::error::playstore boot timeout"
          tail -30 work/emulator.log || true
          exit 1

      - name: Drive BlackDex (uiautomator automation, no root)
        run: bash unpack/playstore_flow.sh || true

      - name: Collect output
        id: count_ps
        if: always()
        run: |
          val=$(cat count/dex_count 2>/dev/null || echo 0)
          echo "dex_count=${val:-0}" >> "$GITHUB_OUTPUT"
          echo "playstore dex dumps: ${val:-0}"

      - name: Gate (fail job when no dumps)
        if: always() && steps.count_ps.outputs.dex_count == '0'
        run: |
          echo '::error::playstore/BlackDex run produced 0 DEX (see dumps-playstore artifact: logcat + blackdex output).'
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dumps-playstore
          path: |
            dumped/
            dumps/
            work/logcat-playstore.txt
            work/props-evidence.txt
            work/abi-info.txt
            work/bd32-abi.txt
            work/ps-after.txt
            work/emulator.log
            work/packed.apk
            work/apk.sha256
          if-no-files-found: warn
          retention-days: 7

  unpack-x86:
    if: ${{ !inputs.skip_x86 }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      dex_count: ${{ steps.count.outputs.dex_count }}
    env:
      APP_ID: com.world.youcinemobile
      LAUNCH: com.mobile.brasiltv.activity.SplashAty
      EXPECT_DEX: '4'
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python deps
        run: python3 -m pip install --quiet androguard pycryptodome

      - uses: android-actions/setup-android@v3

      - name: SDK + AVD
        env:
          API: ${{ github.event.inputs.api_level || '30' }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-${API};google_apis;x86_64" \
            "platforms;android-${API}" "build-tools;34.0.0" > /dev/null
          echo "no" | avdmanager create avd -n youcine \
            -k "system-images;android-${API};google_apis;x86_64" \
            -d pixel_4 --force

      - name: Fetch packed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work dumped/youcine
          gh release download "${{ github.event.inputs.release_tag }}" \
            -R "${{ github.repository }}" \
            -p "${{ github.event.inputs.release_asset }}" \
            -O work/packed.apk
          sha256sum work/packed.apk | tee work/apk.sha256

      - name: "Dump build (evidence: re-signed x86_64 variant)"
        run: |
          python3 unpack/make_dump_build.py --apk work/packed.apk --out work/dump-build.apk
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          zipalign -f 4 work/dump-build.apk work/dump-build-aligned.apk
          keytool -genkeypair -keystore work/re.keystore -storepass android \
            -alias re -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Youcine-RE,O=Research,C=US" 2>/dev/null
          apksigner sign --ks work/re.keystore --ks-pass pass:android \
            --out work/dump-build-signed.apk work/dump-build-aligned.apk
          ls -l work/ || true

      - name: "Build trace_guard (NDK x86_64)"
        run: |
          sdkmanager "ndk;26.3.11579264" > /dev/null || true
          CLANG="$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          "$CLANG" --target=x86_64-linux-android24 -O2 -o work/trace_guard unpack/trace_guard.c
          file work/trace_guard || true
          ls -l work/trace_guard
          rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/.temp" 2>/dev/null || true
          df -h / | tail -1

      - name: Boot emulator and dump (dump-build + ptrace syscall guard)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '30' }}
          arch: x86_64
          avd-name: youcine
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb root || true
            sleep 5
            adb push work/trace_guard /data/local/tmp/trace_guard || true
            adb shell "chmod 755 /data/local/tmp/trace_guard" || true
            adb shell "setprop debug.ld.app.$APP_ID dlopen" || true
            adb shell "rm -f /data/local/tmp/guard.log /data/local/tmp/yc_guard.pid" || true
            adb install -r -g work/dump-build-signed.apk || true
            sleep 5 || true
            adb shell pm path $APP_ID || echo DUMP_INSTALL_MISSING || true
            adb shell "dumpsys package $APP_ID | grep -iE 'primaryCpuAbi' | head -2" || true
            adb shell stop || true
            for i in $(seq 1 60); do adb shell getprop init.svc.zygote 2>/dev/null | tr -d '\r' | grep -q stopped && break; sleep 1; done || true
            adb pull /data/system/packages.xml work/packages-dump.xml || true
            python3 unpack/patch_packages_xml.py --dump work/packages-dump.xml --out work/packages-patched.xml || true
            adb push work/packages-patched.xml /data/system/packages.xml || true
            adb shell start || true
            sleep 75 || true
            for i in $(seq 1 60); do adb shell pm path com.android.shell >/dev/null 2>&1 && break; sleep 2; done || true
            sleep 10 || true
            adb shell pm path $APP_ID || echo PACKAGE_GONE_AFTER_TRANSPLANT || true
            adb shell "setsid /data/local/tmp/trace_guard com.world.youcinemobile 320 > /data/local/tmp/guard.log 2>&1 &" || true
            sleep 1
            adb logcat -c || true
            adb shell am start -n $APP_ID/$LAUNCH || true
            python3 unpack/external_memdump.py --app $APP_ID --out-dir dumped/youcine --expect $EXPECT_DEX --timeout 260 --settle 1.0 --no-freeze || true
            adb shell "cat /data/local/tmp/guard.log 2>/dev/null | tail -50" || true
            adb logcat -d -b main,system,crash > work/logcat.txt 2>/dev/null || true
            cp -f work/logcat.txt work/logcat-x86.txt || true
            ls -la dumped/youcine || true
            mkdir -p count
            ls dumped/youcine/dex_*.bin 2>/dev/null | wc -l | tr -d ' ' > count/dex_count
            cat count/dex_count

      - name: Collect output
        id: count
        if: always()
        run: |
          val=$(cat count/dex_count 2>/dev/null || echo 0)
          echo "dex_count=${val:-0}" >> "$GITHUB_OUTPUT"
          echo "x86 dex dumps: ${val:-0}"

      - name: Gate (fail job when no dumps)
        if: always() && steps.count.outputs.dex_count == '0'
        run: |
          echo '::error::x86 dump-build produced 0 DEX (expected: iJiami content-integrity gate blocks decryption of modified APKs; kept as the documented research path).'
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dumps-x86
          path: |
            dumped/
            work/logcat-x86.txt
            work/packed.apk
            work/apk.sha256
            work/dump-build.apk.sha256
            work/trace_guard
            work/packages-dump.xml
            work/packages-patched.xml
          if-no-files-found: warn
          retention-days: 7

  unpack-selfhosted-mac:
    # OPTIONAL completion path: run on YOUR OWN Mac via a self-hosted runner
    # (Settings -> Actions -> Runners -> New self-hosted runner; labels:
    # [self-hosted, macOS]). On real hardware Hypervisor.framework works, so
    # the arm64 emulator runs at FULL SPEED with the ORIGINAL apk.
    if: ${{ inputs.run_selfhosted }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    outputs:
      dex_count: ${{ steps.count_sh.outputs.dex_count }}
    env:
      APP_ID: com.world.youcinemobile
      LAUNCH: com.mobile.brasiltv.activity.SplashAty
      EXPECT_DEX: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3

      - name: SDK + arm64 image + AVD
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-30;google_apis;arm64-v8a" \
            "platforms;android-30" > /dev/null
          echo "no" | avdmanager create avd -n youcine-sh \
            -k "system-images;android-30;google_apis;arm64-v8a" \
            -d pixel_4 --force

      - name: Fetch packed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work dumped/youcine
          gh release download packed-1.17.6 -R "$GITHUB_REPOSITORY" \
            -p ycMob_1.17.6_ycsite.apk -O work/packed.apk

      - name: Boot, install ORIGINAL apk, dump
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          nohup emulator -avd youcine-sh -no-window -gpu swiftshader_indirect \
            -noaudio -no-boot-anim -camera-back none -port 5554 \
            > work/emulator.log 2>&1 &
          for i in $(seq 1 120); do
            v=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$v" = "1" ] && echo "BOOT_OK" && break
            sleep 10
          done
          adb root || true
          sleep 5
          adb install -r -g work/packed.apk || true
          adb shell "setprop debug.ld.app.$APP_ID dlopen" || true
          adb logcat -c || true
          adb shell am start -n $APP_ID/$LAUNCH || true
          python3 unpack/external_memdump.py \
            --app "$APP_ID" --out-dir dumped/youcine \
            --expect "$EXPECT_DEX" --timeout 900 --settle 8 || true
          adb logcat -d -b main,system,crash > work/logcat-selfhosted.txt 2>/dev/null || true
          mkdir -p count
          ls dumped/youcine/dex_*.bin 2>/dev/null | wc -l | tr -d ' ' > count/dex_count
          cat count/dex_count

      - name: Collect output
        id: count_sh
        if: always()
        run: |
          val=$(cat count/dex_count 2>/dev/null || echo 0)
          echo "dex_count=${val:-0}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dumps-selfhosted
          path: |
            dumped/
            work/logcat-selfhosted.txt
            work/packed.apk
          if-no-files-found: warn
          retention-days: 7

  rebuild:
    needs: [unpack-nodebug, unpack-playstore, unpack-x86, unpack-selfhosted-mac]
    if: always() && (needs.unpack-nodebug.outputs.dex_count > 0 || needs.unpack-playstore.outputs.dex_count > 0 || needs.unpack-x86.outputs.dex_count > 0 || needs.unpack-selfhosted-mac.outputs.dex_count > 0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APKTOOL_JAR: work/apktool.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3

      - name: SDK + apktool
        run: |
          mkdir -p work dexs
          sdkmanager "build-tools;34.0.0" > /dev/null || true
          curl -fsSL -o work/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar

      - name: Download dumps
        uses: actions/download-artifact@v4
        with:
          pattern: dumps-*
          merge-multiple: true
          path: dumps/

      - name: Show dumps
        run: |
          find dumps -maxdepth 3 -type f | head -40 || true
          ls -la dumps/youcine/*.bin 2>/dev/null | head || true

      - name: Validate and rebuild unpacked APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          APK=""
          for c in "dumps/work/packed.apk" "dumps/youcine/work/packed.apk" "dumps-x86/work/packed.apk"; do
            [ -f "$c" ] && APK="$c" && break
          done
          if [ -z "$APK" ]; then
            gh release download "${{ github.event.inputs.release_tag || 'packed-1.17.6' }}" \
              -R "$GITHUB_REPOSITORY" \
              -p "${{ github.event.inputs.release_asset || 'ycMob_1.17.6_ycsite.apk' }}" \
              -O work/packed.apk
            APK="work/packed.apk"
          fi
          mkdir -p dexs
          python3 unpack/validate_and_extract_dex.py \
            --dump-dir dumps/youcine --out-dir dexs --min-size 65536 || true
          ls -la dexs/ || true
          if ls dexs/*.dex >/dev/null 2>&1; then
            keytool -genkeypair -keystore work/re.keystore -storepass android \
              -alias re -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Youcine-RE,O=Research,C=US" 2>/dev/null || true
            python3 unpack/rebuild_unpacked_apk.py \
              --apk "$APK" \
              --dump-dir dexs \
              --out work/youcine-1.17.6-unpacked.apk \
              --keystore work/re.keystore \
              --storepass android
            sha256sum work/youcine-1.17.6-unpacked.apk | tee work/unpacked.sha256
            gh release create unpacked-1.17.6 \
              --title "Unpacked research build 1.17.6" \
              --notes "Packer-stripped research build produced by the dynamic-unpack workflow. See docs/en/06-dynamic-unpack.md." \
              --target "$GITHUB_SHA" || true
            gh release upload unpacked-1.17.6 \
              work/youcine-1.17.6-unpacked.apk work/unpacked.sha256 --clobber || true
            # chain the boot test against the fresh release
            gh workflow run boot-test.yml -R "$GITHUB_REPOSITORY" --ref main || true
          else
            echo "::warning::no valid DEX dumps; nothing to rebuild"
            exit 3
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youcine-unpacked-${{ github.run_id }}
          path: |
            work/*.apk
            work/*.sha256
            dexs/
            dumps/youcine/*.bin
            dumps/youcine/maps_snapshot.txt
            dumps/youcine/libexec.extracted.so
          if-no-files-found: warn
          retention-days: 7
