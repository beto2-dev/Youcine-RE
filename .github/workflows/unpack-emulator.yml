name: Dynamic unpack (emulator)

# Youcine-RE - iJiami unpack on an x86_64 emulator.
#
# FULLY DIAGNOSED CAUSAL CHAIN (see docs/en/06-dynamic-unpack.md):
#   1. armeabi-v7a install -> FULL ARM process (/system/bin/arm/app_process,
#      everything under ndk_translation) -> x86 libexec rejected (EM_386 vs
#      EM_ARM); arm64 libexec runs translated and SecLLVM self-decryption
#      fails -> s.h.e.l.l.N.al never registered.
#   2. Pure x86_64 dump-build (libexec.so + libexecmain.so load NATIVELY,
#      proven with frida) is SIGKILLed by iJiami's signature check using
#      RAW SYSCALLS (bypasses libc, so frida libc replacement is useless).
#
# THE FIX: unpack/trace_guard.c (built with the NDK, runs as root on the
# device) PTRACE_ATTACHes to the app the moment it appears and rewrites
# kill/tgkill/exit/exit_group SYSCALLS to getpid. The tamper suicide is
# neutralized, decryption proceeds, and after the post-decrypt crash the
# runtime's exit is blocked too - the process hangs ALIVE with the
# decrypted DEX still mapped for the external memdump.
#
# The rebuild job restores the real Application class, drops packer
# assets, swaps in the dumped classes*.dex, zipaligns, signs and publishes
# the 'unpacked-1.17.6' release for the boot-test workflow.

on:
  workflow_dispatch:
    inputs:
      apk_source:
        description: 'packed APK source'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - secret
      api_level:
        description: 'x86_64 emulator API level'
        required: true
        default: '30'
        type: string
      skip_x86:
        description: 'skip the x86_64 dump-build job (tamper check kills it)'
        required: false
        default: false
        type: boolean
      release_tag:
        default: 'packed-1.17.6'
      release_asset:
        default: 'ycMob_1.17.6_ycsite.apk'

permissions:
  contents: write

jobs:
  unpack-x86:
    if: ${{ !inputs.skip_x86 }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      dex_count: ${{ steps.count.outputs.dex_count }}
    env:
      APP_ID: com.world.youcinemobile
      LAUNCH: com.mobile.brasiltv.activity.SplashAty
      EXPECT_DEX: '4'
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python deps
        run: python3 -m pip install --quiet androguard pycryptodome

      - uses: android-actions/setup-android@v3

      - name: SDK + AVD
        env:
          API: ${{ github.event.inputs.api_level || '30' }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-${API};google_apis;x86_64" \
            "platforms;android-${API}" "build-tools;34.0.0" > /dev/null
          echo "no" | avdmanager create avd -n youcine \
            -k "system-images;android-${API};google_apis;x86_64" \
            -d pixel_4 --force

      - name: Fetch packed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work dumped/youcine
          if [ "${{ github.event.inputs.apk_source }}" = "release" ]; then
            gh release download "${{ github.event.inputs.release_tag }}" \
              -R "${{ github.repository }}" \
              -p "${{ github.event.inputs.release_asset }}" \
              -O work/packed.apk
          else
            curl -fL --retry 3 -o work/packed.apk "${{ secrets.SAMPLE_URL }}"
          fi
          sha256sum work/packed.apk | tee work/apk.sha256
          grep -q 28d028d75c89e6ab90c8b7e57a32c42355ac5ae2e388ea1e541bd003cae10d83 work/apk.sha256 \
            || echo "::warning::SHA-256 differs from the analysed 1.17.6 sample"

      - name: "Dump build (evidence: re-signed x86_64 variant)"
        run: |
          python3 unpack/make_dump_build.py --apk work/packed.apk --out work/dump-build.apk || true
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          zipalign -f 4 work/dump-build.apk work/dump-build-aligned.apk || true
          keytool -genkeypair -keystore work/re.keystore -storepass android \
            -alias re -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Youcine-RE,O=Research,C=US" 2>/dev/null || true
          apksigner sign --ks work/re.keystore --ks-pass pass:android \
            --out work/dump-build-signed.apk work/dump-build-aligned.apk || true
          ls -l work/ || true

      - name: "Build trace_guard (NDK x86_64)"
        run: |
          sdkmanager "ndk;26.3.11579264" > /dev/null || true
          CLANG="$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          "$CLANG" --target=x86_64-linux-android24 -O2 -o work/trace_guard unpack/trace_guard.c
          file work/trace_guard || true
          ls -l work/trace_guard
          # the NDK eats ~2.5 GB; the emulator needs that space for userdata
          rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/.temp" 2>/dev/null || true
          df -h / | tail -1

      - name: Boot emulator and dump (dump-build + ptrace syscall guard)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '30' }}
          arch: x86_64
          avd-name: youcine
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb root || true
            sleep 5
            adb push work/trace_guard /data/local/tmp/trace_guard || true
            adb shell "chmod 755 /data/local/tmp/trace_guard" || true
            adb shell "setprop debug.ld.app.$APP_ID dlopen" || true
            adb shell "rm -f /data/local/tmp/guard.log /data/local/tmp/yc_guard.pid" || true
            adb install -r -g work/packed.apk || true
            adb shell "am force-stop $APP_ID" || true
            adb shell stop || true
            sleep 3
            adb pull /data/system/packages.xml work/packages-orig.xml || true
            adb shell start || true
            for i in $(seq 1 90); do adb shell service check package 2>/dev/null | grep -q found && break; sleep 2; done || true
            adb uninstall $APP_ID || true
            adb install -r -g work/dump-build-signed.apk || true
            adb shell "dumpsys package $APP_ID | grep -iE 'primaryCpuAbi' | head -2" || true
            adb shell stop || true
            sleep 3
            adb pull /data/system/packages.xml work/packages-dump.xml || true
            python3 unpack/patch_packages_xml.py --orig work/packages-orig.xml --dump work/packages-dump.xml --out work/packages-patched.xml || true
            adb push work/packages-patched.xml /data/system/packages.xml || true
            adb shell start || true
            for i in $(seq 1 90); do adb shell service check package 2>/dev/null | grep -q found && break; sleep 2; done || true
            adb shell "setsid /data/local/tmp/trace_guard com.world.youcinemobile 320 > /data/local/tmp/guard.log 2>&1 &" || true
            sleep 1
            adb logcat -c || true
            adb shell am start -n $APP_ID/$LAUNCH || true
            python3 unpack/external_memdump.py --app $APP_ID --out-dir dumped/youcine --expect $EXPECT_DEX --timeout 260 --settle 1.0 --no-freeze --pull-app-data || true
            adb shell "ps -A | grep youcine || echo APP_NOT_RUNNING" || true
            adb shell "cat /proc/$(adb shell pidof $APP_ID | tr -d '\r')/maps 2>/dev/null | grep -E 'libexec|ijm' | head -10" || true
            adb shell "cat /data/local/tmp/guard.log 2>/dev/null | tail -50" || true
            adb pull /data/data/$APP_ID/files/libexec.so dumped/youcine/libexec.extracted.so 2>/dev/null || true
            adb logcat -d -b main,system,crash > work/logcat.txt 2>/dev/null || true
            cp -f work/logcat.txt work/logcat-x86.txt || true
            ls -la dumped/youcine || true
            mkdir -p count
            ls dumped/youcine/dex_*.bin 2>/dev/null | wc -l | tr -d ' ' > count/dex_count
            cat count/dex_count

      - name: Collect output
        id: count
        if: always()
        run: |
          val=$(cat count/dex_count 2>/dev/null || echo 0)
          echo "dex_count=${val:-0}" >> "$GITHUB_OUTPUT"
          echo "x86 dex dumps: ${val:-0}"
          grep -E "ijiami|s\.h\.e\.l\.l|UnsatisfiedLink|dlopen|libexec|FATAL" \
            work/logcat.txt | head -30 || true

      - name: Gate (fail job when no dumps)
        if: always() && steps.count.outputs.dex_count == '0'
        run: |
          echo '::error::x86 dump-build produced 0 DEX. Expected: iJiami anti-tamper signature check SIGKILLs the re-signed build (observed ~0.2s after start). Falling back to unpack-arm.'
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dumps-x86
          path: |
            dumped/
            work/logcat-x86.txt
            work/apk.sha256
            work/dump-build.apk.sha256
            work/trace_guard
            work/packages-orig.xml
            work/packages-dump.xml
            work/packages-patched.xml
          if-no-files-found: warn
          retention-days: 7

  unpack-arm:
    needs: unpack-x86
    if: always() && (needs.unpack-x86.result == 'failure' || needs.unpack-x86.result == 'skipped')
    runs-on: macos-14
    timeout-minutes: 50
    outputs:
      dex_count: ${{ steps.count_arm.outputs.dex_count }}
    env:
      APP_ID: com.world.youcinemobile
      LAUNCH: com.mobile.brasiltv.activity.SplashAty
      EXPECT_DEX: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3

      - name: SDK + ARM image
        id: armimg
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" > /dev/null
          for api in 33 30 31 32 34; do
            if sdkmanager "system-images;android-${api};google_apis;arm64-v8a" "platforms;android-${api}" > /dev/null 2>&1; then
              echo "api=$api" >> "$GITHUB_OUTPUT"
              echo "using system-images;android-${api};google_apis;arm64-v8a"
              exit 0
            fi
          done
          echo "::error::no arm64-v8a google_apis image found"
          exit 1

      - name: Fetch packed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work dumped/youcine
          gh release download "${{ github.event.inputs.release_tag }}" \
            -R "${{ github.repository }}" \
            -p "${{ github.event.inputs.release_asset }}" \
            -O work/packed.apk
          sha256sum work/packed.apk || shasum -a 256 work/packed.apk

      - name: Boot emulator and dump (native arm64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.armimg.outputs.api }}
          arch: arm64-v8a
          avd-name: youcine-arm
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb root || true
            sleep 5
            adb install -r -g work/packed.apk || true
            adb logcat -c || true
            adb shell am start -n $APP_ID/$LAUNCH || true
            python3 unpack/external_memdump.py --app $APP_ID --out-dir dumped/youcine --expect $EXPECT_DEX --timeout 300 --settle 1.2 --pull-app-data || true
            adb shell "ps -A | grep youcine || echo APP_NOT_RUNNING" || true
            adb pull /data/data/$APP_ID/files/libexec.so dumped/youcine/libexec.extracted.so 2>/dev/null || true
            adb logcat -d -b main,system,crash > work/logcat.txt 2>/dev/null || true
            cp -f work/logcat.txt work/logcat-arm.txt || true
            ls -la dumped/youcine || true
            mkdir -p count
            echo "dex_count=$(ls dumped/youcine/dex_*.bin 2>/dev/null | wc -l | tr -d ' ')" > count/dex_count
            cat count/dex_count

      - name: Collect output
        id: count_arm
        if: always()
        run: |
          val=$(cat count/dex_count 2>/dev/null || echo 0)
          echo "dex_count=${val:-0}" >> "$GITHUB_OUTPUT"
          echo "arm dex dumps: ${val:-0}"

      - name: Gate (fail job when no dumps)
        if: always() && steps.count_arm.outputs.dex_count == '0'
        run: |
          echo '::error::arm64 native dump produced 0 DEX; inspect dumps-arm artifact logcat.'
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dumps-arm
          path: |
            dumped/
            work/logcat-arm.txt
            work/packed.apk
          if-no-files-found: warn
          retention-days: 7

  rebuild:
    needs: [unpack-x86, unpack-arm]
    if: always() && (needs.unpack-x86.result == 'success' || needs.unpack-arm.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APKTOOL_JAR: work/apktool.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v3

      - name: SDK + apktool
        run: |
          mkdir -p work dexs
          sdkmanager "build-tools;34.0.0" > /dev/null || true
          curl -fsSL -o work/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar

      - name: Download dumps
        uses: actions/download-artifact@v4
        with:
          pattern: dumps-*
          merge-multiple: true
          path: dumps/

      - name: Show dumps
        run: |
          find dumps -maxdepth 3 -type f | head -40 || true
          ls -la dumps/youcine/*.bin 2>/dev/null | head || true

      - name: Validate and rebuild unpacked APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          APK="dumps-arm/work/packed.apk"
          [ -f "$APK" ] || APK="dumps/work/packed.apk"
          # packed apk fallback: fetch from release
          if [ ! -f "$APK" ]; then
            gh release download packed-1.17.6 -R "$GITHUB_REPOSITORY" \
              -p ycMob_1.17.6_ycsite.apk -O work/packed.apk
            APK="work/packed.apk"
          fi
          mkdir -p dexs
          python3 unpack/validate_and_extract_dex.py \
            --dump-dir dumps/youcine --out-dir dexs --min-size 65536 || true
          ls -la dexs/ || true
          if ls dexs/*.dex >/dev/null 2>&1; then
            python3 unpack/rebuild_unpacked_apk.py \
              --apk "$APK" \
              --dump-dir dexs \
              --out work/youcine-1.17.6-unpacked.apk \
              --keystore work/re.keystore \
              --storepass android
            sha256sum work/youcine-1.17.6-unpacked.apk | tee work/unpacked.sha256
            # publish for the boot-test workflow
            gh release create unpacked-1.17.6 \
              --title "Unpacked research build 1.17.6" \
              --notes "Packer-stripped research build produced by the dynamic-unpack workflow. See docs/en/06-dynamic-unpack.md." \
              --target "$GITHUB_SHA" || true
            gh release upload unpacked-1.17.6 \
              work/youcine-1.17.6-unpacked.apk work/unpacked.sha256 --clobber || true
          else
            echo "::warning::no valid DEX dumps; nothing to rebuild"
            exit 3
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youcine-unpacked-${{ github.run_id }}
          path: |
            work/*.apk
            work/*.sha256
            dexs/
            dumps/youcine/*.bin
            dumps/youcine/maps_snapshot.txt
            dumps/youcine/libexec.extracted.so
          if-no-files-found: warn
          retention-days: 7
