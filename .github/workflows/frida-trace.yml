name: Frida guard (tamper bypass + dump)

# Youcine-RE - anti-tamper neutralizer + timed freeze + DEX dump.
#
# THE PROBLEM (fully diagnosed with bionic debug.ld logging):
#   * the armeabi-v7a process is a FULL ARM process (/system/bin/arm/
#     app_process, everything under ndk_translation) -> the x86 libexec
#     is rejected: "is for EM_386 (3) instead of EM_ARM (40)"
#   * the arm64 libexec loads but SecLLVM self-decryption fails under
#     binary translation -> N.al never registered
#   * the pure x86_64 dump-build (libexec runs NATIVELY, proven) is
#     SIGKILLed ~0.2s after start by iJiami's signature verification of
#     the re-signed APK
#
# THE FIX: frida spawn-gates the dump-build process and replaces
# libc kill/tgkill/exit/abort so the signature check cannot commit
# suicide, then SIGSTOPs the process exactly when the real Application
# is about to be instantiated (decrypted DEX in memory) for the external
# poll-and-freeze memdump.

on:
  workflow_dispatch:

jobs:
  guard-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ID: com.world.youcinemobile
      FRIDA_VERSION: '16.6.6'
      EXPECT_DEX: '4'
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python deps
        run: python3 -m pip install --quiet frida==16.6.6

      - uses: android-actions/setup-android@v3

      - name: SDK + AVD
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-30;google_apis;x86_64" \
            "platforms;android-30" "build-tools;34.0.0" > /dev/null
          echo "no" | avdmanager create avd -n youcine \
            -k "system-images;android-30;google_apis;x86_64" \
            -d pixel_4 --force

      - name: Fetch packed APK + build dump-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work dumped/youcine
          gh release download packed-1.17.6 -R "$GITHUB_REPOSITORY" \
            -p ycMob_1.17.6_ycsite.apk -O work/packed.apk
          sha256sum work/packed.apk
          python3 unpack/make_dump_build.py --apk work/packed.apk --out work/dump-build.apk
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          zipalign -f 4 work/dump-build.apk work/dump-build-aligned.apk
          keytool -genkeypair -keystore work/re.keystore -storepass android \
            -alias re -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Youcine-RE,O=Research,C=US" 2>/dev/null
          apksigner sign --ks work/re.keystore --ks-pass pass:android \
            --out work/dump-build-signed.apk work/dump-build-aligned.apk
          ls -l work/

      - name: "Frida server (x86_64 build)"
        run: |
          curl -fsSL -o work/fs.xz \
            "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-x86_64.xz"
          xz -d work/fs.xz
          ls -l work/fs

      - name: Boot emulator, guard, freeze, dump
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          avd-name: youcine
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb root || true
            sleep 5
            adb push work/fs /data/local/tmp/fs || true
            adb shell "chmod 755 /data/local/tmp/fs" || true
            adb shell "setsid /data/local/tmp/fs -l 127.0.0.1:4789 > /data/local/tmp/fs.log 2>&1 &" || true
            sleep 2
            adb shell "ps -A | grep ' fs$' || echo FRIDA_NOT_RUNNING" || true
            adb forward tcp:4789 tcp:4789 || true
            adb install -r -g work/dump-build-signed.apk || true
            adb shell "setprop debug.ld.app.$APP_ID dlopen" || true
            adb logcat -c || true
            TRACE_SECONDS=90 DUMP_TIMEOUT=300 SCRIPT=05_tamper_guard.js python3 unpack/frida_trace_driver.py || true
            adb shell "ps -A | grep youcine || echo APP_NOT_RUNNING" || true
            adb logcat -d -b main,system,crash > work/logcat.txt 2>/dev/null || true
            ls -la dumped/youcine || true
            mkdir -p count
            ls dumped/youcine/dex_*.bin 2>/dev/null | wc -l | tr -d ' ' > count/dex_count
            cat count/dex_count

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frida-guard-${{ github.run_id }}
          path: |
            work/trace.log
            work/logcat.txt
            dumped/
          if-no-files-found: warn
          retention-days: 7
