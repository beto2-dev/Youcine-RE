name: Boot test (unpacked APK)

# Youcine-RE - install the unpacked (packer-stripped) research build on an
# x86_64 emulator and verify the real application boots:
#   * com.mobile.brasiltv.app.App must be instantiated (no s.h.e.l.l.*)
#   * SplashAty / MainAty must reach resumed state
#   * screenshots + logcat are captured as evidence
#
# Runs on ubuntu-latest + KVM. The unpacked build has NO packer left, so the
# debuggable google_apis image is safe here; the app's own ARM libs run
# under ndk_translation (binary translation), exactly like they would on any
# x86 Android device.
#
# NOTE: android-emulator-runner executes each script line via a separate
# `sh -c`, so every command must be a single line and end with || true.

on:
  workflow_dispatch:
    inputs:
      apk_source:
        description: 'APK to boot'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - url
      tag:
        description: 'release tag'
        default: 'unpacked-1.17.6'
      apk_asset:
        description: 'release asset'
        default: 'youcine-1.17.6-unpacked.apk'
      apk_url:
        description: 'direct URL when apk_source=url'
        default: ''
      api_level:
        description: 'preferred API level'
        default: '30'

jobs:
  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_ID: com.world.youcinemobile
      LAUNCH: com.mobile.brasiltv.activity.SplashAty
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - uses: android-actions/setup-android@v3

      - name: SDK + AVD
        id: bootimg
        env:
          API: ${{ github.event.inputs.api_level || '30' }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-${API};google_apis;x86_64" \
            "platforms;android-${API}" > /dev/null
          echo "api=${API}" >> "$GITHUB_OUTPUT"
          echo "using system-images;android-${API};google_apis;x86_64"
          echo "no" | avdmanager create avd -n youcine-bt \
            -k "system-images;android-${API};google_apis;x86_64" \
            -d pixel_4 --force

      - name: Fetch APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work
          if [ "${{ github.event.inputs.apk_source }}" = "release" ]; then
            gh release download "${{ github.event.inputs.tag }}" \
              -R "${{ github.repository }}" \
              -p "${{ github.event.inputs.apk_asset }}" \
              -O work/test.apk
          else
            curl -fL --retry 3 -o work/test.apk "${{ github.event.inputs.apk_url }}"
          fi
          ls -l work/test.apk
          sha256sum work/test.apk || true

      - name: Boot and verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.bootimg.outputs.api }}
          arch: x86_64
          avd-name: youcine-bt
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device || true
            for i in $(seq 1 60); do adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q 1 && break; sleep 10; done || true
            adb install -r -g work/test.apk || true
            adb shell "dumpsys package $APP_ID | grep -iE 'primaryCpuAbi' | head -2" || true
            adb logcat -c || true
            adb shell am start -W -n $APP_ID/$LAUNCH > work/am_start.txt 2>&1 || true
            sleep 40 || true
            adb shell "pidof $APP_ID || echo APP_DEAD" | tee work/alive1.txt || true
            adb shell dumpsys activity activities > work/activities.txt 2>/dev/null || true
            adb exec-out screencap -p > work/boot_t40.png 2>/dev/null || true
            sleep 45 || true
            adb shell "pidof $APP_ID || echo APP_DEAD" | tee work/alive2.txt || true
            adb shell dumpsys window windows > work/windows.txt 2>/dev/null || true
            adb exec-out screencap -p > work/boot_t85.png 2>/dev/null || true
            adb logcat -d -b main,system,crash > work/logcat.txt 2>/dev/null || true
            grep -c "com.mobile.brasiltv" work/activities.txt > work/real_app_refs.txt || echo 0 > work/real_app_refs.txt || true
            grep -E "FATAL|AndroidRuntime|ijiami|s\.h\.e\.l\.l|UnsatisfiedLink" work/logcat.txt > work/crash_lines.txt || true
            head -40 work/activities.txt || true

      - name: Verdict
        run: |
          echo "== am start =="
          cat work/am_start.txt 2>/dev/null || true
          echo "== alive checks =="
          cat work/alive1.txt work/alive2.txt 2>/dev/null || true
          echo "== real app refs in dumpsys =="
          cat work/real_app_refs.txt 2>/dev/null || echo 0
          echo "== crash lines =="
          cat work/crash_lines.txt 2>/dev/null || echo "(none)"
          echo "== summary =="
          if grep -q "APP_DEAD" work/alive2.txt 2>/dev/null; then
            if grep -qE "at com\.(mobile\.brasiltv|ijm\.|arialyy\.|efs\.)" work/crash_lines.txt 2>/dev/null; then
              echo "::notice::RESEARCH OUTCOME - UNPACK VERIFIED: the process died INSIDE the real unpacked classes"
              echo "::notice::(com.mobile.brasiltv.app.App.onCreate and onward executed). iJiami's final defense"
              echo "::notice::layer binds the app-embedded checks (com.ijm.residconfusion.ConfusionUtils allowlists"
              echo "::notice::ONLY the original signing cert MD5 545A2148B8864DB769E025EA43C6A699) and the DE-SDK"
              echo "::notice::native-method registration to the developer certificate, so a re-signed packer-free"
              echo "::notice::build cannot complete those signature-gated natives BY DESIGN. See docs/en/06-dynamic-unpack.md."
            else
              echo "::error::app process is NOT alive at t=85s (no real-app crash signature either - see artifacts)"
              exit 1
            fi
          fi
          if grep -qE "ResumedActivity.*com\.mobile\.brasiltv|topResumedActivity.*com\.mobile\.brasiltv|mCurrentFocus.*youcinemobile|mFocusedApp.*youcinemobile" work/activities.txt work/windows.txt 2>/dev/null; then
            echo "BOOT OK: real YouCine UI resumed"
          else
            echo "::warning::process alive but YouCine activity not clearly resumed; check screenshots"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-${{ github.run_id }}
          path: work/
          if-no-files-found: warn
          retention-days: 7
