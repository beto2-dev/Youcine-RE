name: Boot test (unpacked APK)

# Youcine-RE - install the unpacked APK on an ARM emulator (ijkplayer and
# Ranger JNI are ARM-only) and capture logcat + a screenshot of SplashAty.

on:
  workflow_dispatch:
    inputs:
      apk_source:
        description: 'APK to boot'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - url
      tag:
        description: 'release tag'
        default: 'unpacked-1.17.6'
      apk_asset:
        description: 'release asset'
        default: 'youcine-1.17.6-unpacked.apk'
      apk_url:
        description: 'direct URL when apk_source=url'
        default: ''
      api_level:
        default: '30'

jobs:
  boot-test:
    runs-on: macos-14
    timeout-minutes: 50
    env:
      APP_ID: com.world.youcinemobile
      LAUNCH: com.mobile.brasiltv.activity.SplashAty
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: SDK + ARM AVD
        env:
          API: ${{ github.event.inputs.api_level || '30' }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-${API};google_apis;arm64-v8a" \
            "platforms;android-${API}" || \
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-33;google_apis;arm64-v8a" \
            "platforms;android-33"
          IMG="system-images;android-${API};google_apis;arm64-v8a"
          sdkmanager --list | grep arm64-v8a || true
          echo "no" | avdmanager create avd -n youcine-arm \
            -k "$IMG" -d pixel_4 --force || \
          echo "no" | avdmanager create avd -n youcine-arm \
            -k "system-images;android-33;google_apis;arm64-v8a" -d pixel_4 --force

      - name: Fetch APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work
          if [ "${{ github.event.inputs.apk_source }}" = "release" ]; then
            gh release download "${{ github.event.inputs.tag }}" \
              -R "${{ github.repository }}" \
              -p "${{ github.event.inputs.apk_asset }}" \
              -O work/test.apk
          else
            curl -fL --retry 3 -o work/test.apk "${{ github.event.inputs.apk_url }}"
          fi
          ls -l work/test.apk

      - name: Boot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '33' }}
          arch: arm64-v8a
          avd-name: youcine-arm
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -x
            adb install -r -g work/test.apk
            adb shell am start -n $APP_ID/$LAUNCH
            sleep 12
            adb shell dumpsys activity activities | tee work/activities.txt | head -80
            adb exec-out screencap -p > work/boot.png || true
            adb logcat -d -b main,system,crash > work/logcat.txt || true
            grep -E "FATAL|AndroidRuntime|ijiami|s.h.e.l.l" work/logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-${{ github.run_id }}
          path: work/
          if-no-files-found: warn
          retention-days: 7
