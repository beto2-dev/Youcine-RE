name: Boot test (unpacked APK)

# Youcine-RE - install the unpacked (packer-stripped) research build on an
# x86_64 emulator and verify the real application boots:
#   * com.mobile.brasiltv.app.App must be instantiated (no s.h.e.l.l.*)
#   * SplashAty / MainAty must reach resumed state
#   * screenshots + logcat are captured as evidence
#
# Runs on ubuntu-latest + KVM. The unpacked build has NO packer left, so the
# debuggable google_apis image is safe here; the app's own ARM libs run
# under ndk_translation (binary translation), exactly like they would on any
# x86 Android device.
#
# NOTE: android-emulator-runner executes each script line via a separate
# `sh -c`, so every command must be a single line and end with || true.

on:
  workflow_dispatch:
    inputs:
      apk_source:
        description: 'APK to boot'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - url
      tag:
        description: 'release tag'
        default: 'unpacked-1.17.6'
      apk_asset:
        description: 'release asset'
        default: 'youcine-1.17.6-unpacked.apk'
      apk_url:
        description: 'direct URL when apk_source=url'
        default: ''
      api_level:
        description: 'preferred API level'
        default: '30'

jobs:
  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_ID: com.world.youcinemobile
      LAUNCH: com.mobile.brasiltv.activity.SplashAty
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - uses: android-actions/setup-android@v3

      - name: SDK + AVD
        id: bootimg
        env:
          API: ${{ github.event.inputs.api_level || '30' }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" \
            "system-images;android-${API};google_apis;x86_64" \
            "platforms;android-${API}" > /dev/null
          echo "api=${API}" >> "$GITHUB_OUTPUT"
          echo "using system-images;android-${API};google_apis;x86_64"
          echo "no" | avdmanager create avd -n youcine-bt \
            -k "system-images;android-${API};google_apis;x86_64" \
            -d pixel_4 --force

      - name: Fetch APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work
          if [ "${{ github.event.inputs.apk_source }}" = "release" ]; then
            gh release download "${{ github.event.inputs.tag }}" \
              -R "${{ github.repository }}" \
              -p "${{ github.event.inputs.apk_asset }}" \
              -O work/test.apk
          else
            curl -fL --retry 3 -o work/test.apk "${{ github.event.inputs.apk_url }}"
          fi
          ls -l work/test.apk
          sha256sum work/test.apk || true

      - name: Boot and verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.bootimg.outputs.api }}
          arch: x86_64
          avd-name: youcine-bt
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device || true
            for i in $(seq 1 60); do adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q 1 && break; sleep 10; done || true
            adb install -r -g work/test.apk || true
            adb shell "dumpsys package $APP_ID | grep -iE 'primaryCpuAbi' | head -2" || true
            adb logcat -c || true
            # timeout around -W: the phase-3 builds no longer crash at
            # class-load - the launch can HANG instead (run 34292764876:
            # am start -W blocked 48 min until the job timeout).  A hung
            # launch must become evidence, not a stuck job.
            timeout 90 adb shell am start -W -n $APP_ID/$LAUNCH > work/am_start.txt 2>&1 || echo "AM_START_TIMEOUT: launch never completed (app hung, not crashed)" >> work/am_start.txt
            # adb root: the SIGQUIT dumps land in /data/anr/*.txt which plain
            # shell cannot read (permission denied) - without root the ANR
            # evidence never reaches the artifacts.  google_apis allows it;
            # wait-for-device rides out the brief adbd restart.
            adb root > /dev/null 2>&1 || true
            adb wait-for-device || true
            # kill -3 (SIGQUIT) = full ANR thread dump of every Java
            # thread -> logcat: WHERE the main thread is parked.
            # NOTE: android-emulator-runner runs EACH LINE in its own
            # sh -c (run 34046564135) - control flow must stay one-line.
            PID=$(adb shell pidof $APP_ID | tr -d '\r' | awk '{print $1}'); if [ -n "$PID" ] && [ "$PID" != "APP_DEAD" ]; then adb shell kill -3 $PID || true; sleep 5 || true; fi
            sleep 40 || true
            adb shell "pidof $APP_ID || echo APP_DEAD" | tee work/alive1.txt || true
            adb shell dumpsys activity activities > work/activities.txt 2>/dev/null || true
            adb exec-out screencap -p > work/boot_t40.png 2>/dev/null || true
            # second thread dump right before the evidence capture: a
            # park that moved between the two dumps = real deadlock,
            # identical frames = single blocked launch
            PID2=$(adb shell pidof $APP_ID | tr -d '\r' | awk '{print $1}'); if [ -n "$PID2" ] && [ "$PID2" != "APP_DEAD" ]; then adb shell kill -3 $PID2 || true; sleep 5 || true; fi
            sleep 45 || true
            adb shell "pidof $APP_ID || echo APP_DEAD" | tee work/alive2.txt || true
            adb shell dumpsys window windows > work/windows.txt 2>/dev/null || true
            adb exec-out screencap -p > work/boot_t85.png 2>/dev/null || true
            adb logcat -d -b main,system,crash > work/logcat.txt 2>/dev/null || true
            # the SIGQUIT thread dumps also land in /data/anr/
            adb shell "cat /data/anr/*.txt 2>/dev/null" > work/anr_traces.txt 2>/dev/null || true
            adb shell "run-as $APP_ID ls files 2>/dev/null" > work/data_ls.txt 2>/dev/null || true
            grep -c "com.mobile.brasiltv" work/activities.txt > work/real_app_refs.txt || echo 0 > work/real_app_refs.txt || true
            grep -E "FATAL|AndroidRuntime|ijiami|s\.h\.e\.l\.l|UnsatisfiedLink|YoucineRE|DETool|System\.exit|libijmDataEncryption|ANR in|Input dispatching" work/logcat.txt > work/crash_lines.txt || true
            head -40 work/activities.txt || true

      - name: Verdict
        run: |
          echo "== am start =="
          cat work/am_start.txt 2>/dev/null || true
          echo "== DE SDK load evidence (YoucineRE/DETool/System.exit) =="
          grep -E "YoucineRE|DETool|System\.exit|libijmDataEncryption|DE :" work/logcat.txt | head -25 || echo "(none)"
          echo "== alive checks =="
          cat work/alive1.txt work/alive2.txt 2>/dev/null || true
          echo "== real app refs in dumpsys =="
          cat work/real_app_refs.txt 2>/dev/null || echo 0
          echo "== window focus =="
          grep -E "mCurrentFocus|mFocusedApp" work/windows.txt 2>/dev/null | head -3 || echo "(no focus)"
          echo "== crash lines =="
          cat work/crash_lines.txt 2>/dev/null || echo "(none)"
          echo "== main thread traces (SIGQUIT ANR dumps) =="
          grep -B 1 -A 16 '"main"' work/anr_traces.txt 2>/dev/null | head -42 || echo "(no trace)"
          echo "== summary =="
          # v5 (run 34166250339) exposed a FALSE-POSITIVE 'BOOT OK': the main
          # thread died at App.onCreate:139 -> Aria.init -> SqlHelper.getDb
          # (UnsatisfiedLinkError: the 805 packer-natified methods are
          # registered by libexec's content-gated engine, NOT by the DE SDK -
          # 'DE: ms_sm4_001' proves libijmDataEncryption is the SM4
          # encrypted-SharedPreferences engine), the app's own crash handler
          # then died on an extraction-stub VerifyError, leaving a ZOMBIE
          # process: pidof alive, activity record 'resumed', but
          # mCurrentFocus=null and a 4 KB black screenshot. A real boot
          # therefore requires ALL of: no FATAL EXCEPTION on main, a
          # youcinemobile focused window, and the process alive.
          MAIN_ALIVE=1
          grep -q "FATAL EXCEPTION: main" work/crash_lines.txt 2>/dev/null && MAIN_ALIVE=0
          if [ "$MAIN_ALIVE" = "0" ]; then
            if grep -qE "at com\.(mobile\.brasiltv|ijm\.|arialyy\.|efs\.)" work/crash_lines.txt 2>/dev/null; then
              echo "::notice::RESEARCH OUTCOME - UNPACK VERIFIED: real app code executed (providers, App.onCreate,"
              echo "::notice::ConfusionUtils neutralized, DE SDK SM4 engine initialized, DETool.dowork -> true)."
              echo "::notice::Phase 3 de-natify removed the packer-only natives (805 -> 19 genuine JNI), fixed the"
              echo "::notice::extraction-stub constructors (ctorfix super() injection) and killed the Ranger SDK"
              echo "::notice::signing kill-switch, so a FATAL on main now means a NEW crash layer to diagnose at"
              echo "::notice::the de-natify layer - compare with the previous boot-test crash before fixing."
              echo "::notice::See docs/en/06-dynamic-unpack.md."
            else
              echo "::error::main thread crashed with no real-app signature - see artifacts"
              exit 1
            fi
          elif grep -q "APP_DEAD" work/alive2.txt 2>/dev/null; then
            echo "::error::app process is NOT alive at t=85s and main thread did not crash visibly - see artifacts"
            exit 1
          fi
          if grep -q "AM_START_TIMEOUT" work/am_start.txt 2>/dev/null; then
            echo "::notice::RESEARCH OUTCOME - LAUNCH HANG: the r4 de-natify removed every class-load crash (no"
            echo "::notice::VerifyError, no UnsatisfiedLinkError, no Ranger NPE); the process is alive but the"
            echo "::notice::SplashAty launch never completes within 90 s. The SIGQUIT thread dumps in the"
            echo "::notice::'main thread traces' section above name the exact parked frame chain - that is the"
            echo "::notice::next de-natify layer to fix (await on a stubbed callback / SDK wait / lock)."
          fi
          FOCUS_OK=0
          grep -qE "mCurrentFocus.*(youcinemobile|com\.mobile\.brasiltv)" work/windows.txt 2>/dev/null && FOCUS_OK=1
          RESUMED_OK=0
          grep -qE "ResumedActivity.*com\.mobile\.brasiltv|topResumedActivity.*com\.mobile\.brasiltv|mFocusedApp.*youcinemobile" work/activities.txt work/windows.txt 2>/dev/null && RESUMED_OK=1
          if [ "$MAIN_ALIVE" = "1" ] && [ "$RESUMED_OK" = "1" ] && [ "$FOCUS_OK" = "1" ]; then
            echo "BOOT OK: real YouCine UI resumed AND focused (main thread alive, real window)"
          else
            echo "::warning::process alive but the UI is not really up (main alive=$MAIN_ALIVE resumed=$RESUMED_OK focus=$FOCUS_OK); check screenshots"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-${{ github.run_id }}
          path: work/
          if-no-files-found: warn
          retention-days: 7
